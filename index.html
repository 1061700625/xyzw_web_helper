<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYZW 游戏管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        // 中性底色。此样式只覆盖 Vue 挂载前的加载瞬间，
        // 挂载后由 global.scss 的 --bg-primary 接管，
        // 所以不在这里放渐变，否则暗色模式下会先闪一下亮色。
        background: #f5f7fa;
        min-height: 100vh;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #14161a;
        }
      }

      #app {
        min-height: 100vh;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #6b7280;
        font-size: 15px;
      }

      @media (prefers-color-scheme: dark) {
        .loading {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">正在加载应用...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/xyzw/cocos2d-js-min.js"></script>
    <script type="module" src="/src/xyzw/game-defines.js"></script>
    <script type="module" src="/src/xyzw/index.js"></script>
  </body>
</html>
